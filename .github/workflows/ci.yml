name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit:
    name: Unit Tests — PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php-version: [ '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Check code style
        run: composer cs-check

      - name: Run unit tests
        run: composer test:unit

  integration:
    name: Integration Tests — Ailos API
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run integration tests with secrets from GitHub Actions
        env:
          AILOS_ENVIRONMENT: ${{ secrets.AILOS_ENVIRONMENT }}
          AILOS_CONSUMER_KEY: ${{ secrets.AILOS_CONSUMER_KEY }}
          AILOS_CONSUMER_SECRET: ${{ secrets.AILOS_CONSUMER_SECRET }}
          AILOS_URL_CALLBACK: ${{ secrets.AILOS_URL_CALLBACK }}
          AILOS_API_KEY_DEVELOPER: ${{ secrets.AILOS_API_KEY_DEVELOPER }}
          AILOS_CODIGO_COOPERATIVA: ${{ secrets.AILOS_CODIGO_COOPERATIVA }}
          AILOS_CODIGO_CONTA: ${{ secrets.AILOS_CODIGO_CONTA }}
          AILOS_SENHA: ${{ secrets.AILOS_SENHA }}
        run: php vendor/bin/phpunit -c qa/phpunit.xml --testsuite Integration